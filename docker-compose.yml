services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pipeguard-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/pipeguard.db
    volumes:
      - pipeguard_data:/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: pipeguard-dashboard
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

volumes:
  pipeguard_data: